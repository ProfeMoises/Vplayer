<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor de Video con Chromecast</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Carga la API de Chromecast -->
    <script type="text/javascript" src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
</head>
<body>
    <div class="container">
        <!-- Cabecera -->
        <header class="header">
            <h1>🎬 Mi Reproductor de Video</h1>
            <div class="chromecast-container">
                <google-cast-launcher id="castbutton"></google-cast-launcher>
            </div>
        </header>

        <!-- Contenido principal -->
        <main class="main-content">
            <!-- Reproductor de video -->
            <section class="player-section">
                <div class="video-container">
                    <video 
                        id="videoPlayer" 
                        controls 
                        crossorigin="anonymous"
                        playsinline
                    >
                        Tu navegador no soporta el elemento de video.
                    </video>
                    <div id="castOverlay" class="cast-overlay hidden">
                        <div class="cast-icon">📺</div>
                        <p>Reproduciendo en Chromecast</p>
                    </div>
                </div>
                
                <!-- Controles personalizados -->
                <div class="player-controls">
                    <div class="video-info">
                        <h2 id="videoTitle">Selecciona un video</h2>
                        <span id="videoDuration"></span>
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar" id="progressBar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <span class="time-display">
                            <span id="currentTime">00:00</span> / 
                            <span id="totalTime">00:00</span>
                        </span>
                    </div>
                </div>
            </section>

            <!-- Lista de reproducción -->
            <aside class="playlist-section">
                <h3>📋 Lista de Reproducción</h3>
                <div class="playlist-controls">
                    <button id="shuffleBtn" class="btn-secondary" title="Reproducción aleatoria">🔀 Aleatorio</button>
                    <button id="loopBtn" class="btn-secondary" title="Repetir lista">🔁 Repetir</button>
                </div>
                <ul id="playlist" class="playlist">
                    <!-- Se genera dinámicamente -->
                </ul>
                <div id="loadingState" class="loading-state">
                    <div class="spinner"></div>
                    <p>Cargando videos...</p>
                </div>
                <div id="emptyState" class="empty-state hidden">
                    <p>😕 No se encontraron videos en la carpeta 'fuentes'</p>
                    <p class="text-muted">Agrega archivos .mp4, .webm o .ogg al repositorio</p>
                </div>
            </aside>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
